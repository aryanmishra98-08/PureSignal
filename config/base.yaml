audio:
  sample_rate: 16000
  frame_ms: 20
  window_size_s: 1.5
  hop_size_s: 0.25

vad:
  energy_multiplier: 3.0
  zcr_threshold: 0.3
  hangover_ms: 400
  noise_floor_init: 0.01

encoder:
  model: pyannote/wespeaker-voxceleb-resnet34-LM
  device: mps
  embedding_dim: 256
  min_segment_s: 0.5

tracker:
  similarity_threshold: 0.65
  ema_alpha: 0.25
  max_speakers: 4

enrollment:
  threshold: 0.65
  duration_s: 12
  num_samples: 3

policy:
  mode: ENROLLED
  dynamic_target: S1

ultravox:
  in_rate: 48000
  out_rate: 48000
  chunk_ms: 20

internal:
  norm_floor: 1.0e-6
  noise_floor_ema_fast: 0.05
  noise_floor_ema_slow: 0.95

random_seed: 42
debug: true
