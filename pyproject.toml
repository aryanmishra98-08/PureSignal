[tool.poetry]
name = "PureSignal"
version = "0.1.0"
description = "Real-time speaker-ID pipeline for Apple Silicon. Captures mic audio, identifies enrolled speakers via voice embeddings, and streams approved speech to the Ultravox AI voice API."
authors = ["Aryan"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
sounddevice = ">=0.4.6"
websockets = ">=12.0"
scipy = ">=1.11.0"
numpy = ">=1.26.0"
torch = ">=2.2.0,<2.4.0"
"pyannote.audio" = ">=3.1.0,<4.0.0"
transformers = ">=4.40.0"
huggingface-hub = ">=0.22.0"
python-dotenv = ">=1.0.0"
pyyaml = ">=6.0"
matplotlib = ">=3.8.0"
textgrid = ">=1.5.0"

[tool.poetry.dev-dependencies]
ruff = "*"
pytest = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# eval scripts bootstrap sys.path before importing pipeline modules, so their
# imports genuinely cannot all sit at the top of the file.
"eval/*.py" = ["E402"]
# conftest.py exists to manipulate sys.path.
"tests/conftest.py" = ["E402"]
